<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Manolit∞ Nubes</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet"
        href="https://cesium.com/downloads/cesiumjs/releases/1.122/Build/Cesium/Widgets/widgets.css">
  <style>
    :root {
      --fondo: #03050f;
      --tinta: #e8ecf4;
      --cian: #00f0ff;
      --violeta: #7b2fff;
      --panel: rgba(8, 12, 28, 0.88);
    }
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: var(--fondo);
      color: var(--tinta);
      font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
    }
    #cesiumContainer {
      position: absolute;
      inset: 0;
    }
    #hud {
      position: absolute;
      top: 12px;
      left: 12px;
      z-index: 10;
      display: flex;
      flex-direction: column;
      gap: 8px;
      max-width: 320px;
    }
    #panel {
      background: var(--panel);
      border: 1px solid rgba(0, 240, 255, 0.25);
      border-radius: 12px;
      padding: 12px 14px;
      backdrop-filter: blur(6px);
    }
    #panel h1 {
      margin: 0 0 4px;
      font-size: 15px;
      font-weight: 600;
      letter-spacing: 0.4px;
      color: var(--cian);
    }
    #estado {
      font-size: 12px;
      line-height: 1.5;
      color: var(--tinta);
      min-height: 36px;
    }
    #botones {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      margin-top: 8px;
    }
    #botones button {
      min-height: 34px;
      padding: 6px 12px;
      font-size: 12px;
      color: var(--tinta);
      background: rgba(123, 47, 255, 0.18);
      border: 1px solid rgba(123, 47, 255, 0.55);
      border-radius: 8px;
      cursor: pointer;
      touch-action: manipulation;
    }
    #botones button:hover,
    #botones button:focus-visible {
      background: rgba(0, 240, 255, 0.18);
      border-color: var(--cian);
      outline: none;
    }
    #cargando {
      position: absolute;
      bottom: 18px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 10;
      font-size: 12px;
      padding: 8px 16px;
      border-radius: 999px;
      background: var(--panel);
      border: 1px solid rgba(0, 240, 255, 0.25);
      display: none;
    }
    #cargando.visible { display: block; }
    .cesium-viewer-bottom { display: none; }
  </style>
<base target="_blank">
</head>
<body>
  <div id="cesiumContainer"></div>

  <div id="hud">
    <div id="panel">
      <h1>Manolit∞ Nubes</h1>
      <div id="estado" aria-live="polite">Preparando el visor</div>
      <div id="botones">
        <button id="btn-posicion" type="button">Mi posición</button>
        <button id="btn-aerea" type="button">Vista aérea</button>
        <button id="btn-calle" type="button">Vista calle</button>
      </div>
    </div>
  </div>

  <div id="cargando">Actualizando la nube</div>

  <script src="https://cesium.com/downloads/cesiumjs/releases/1.122/Build/Cesium/Cesium.js"></script>
  <script src="/clouds.js"></script>
</body>
</html>
